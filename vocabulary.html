<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIHONGO NÈ | Học từ vựng</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#294d6c;font:16px Arial,sans-serif;line-height:1.6}
header{background:#294d6c;color:white;padding:28px 20px}
header div,main{max-width:1100px;margin:auto}
h1,h2,p{margin:0 0 12px}
main{padding:20px}
section,article{background:white;border-radius:18px;padding:22px;margin-bottom:16px}
button,a.btn{display:inline-block;border:0;border-radius:9px;background:#294d6c;color:white;padding:11px 16px;font:inherit;cursor:pointer;text-decoration:none}
button.secondary{background:#e5edf5;color:#294d6c}
button:disabled{opacity:.45;cursor:default}
button.active{background:#294d6c;color:white}
nav,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
input,select{width:100%;padding:11px;border:1px solid #ccd7e0;border-radius:9px;font:inherit;background:white;color:inherit}
label{display:block;font-size:14px}
label input,label select{margin-top:5px}
.word{font-size:36px;font-weight:bold;line-height:1.4}
.muted{color:#52677a;font-size:14px}
.tag{background:#e5edf5;padding:4px 10px;border-radius:20px;font-size:13px;display:inline-block}
.flash{
    background:#f9e3eb;
    min-height:250px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    border-radius:16px;
    padding:24px;
    cursor:pointer;
}
.flash.back{background:#e2edf5}
.flash-reading{font-size:22px;margin-top:6px}
.flash:focus-visible{outline:3px solid #294d6c}
.progress{height:9px;background:#e5edf5;border-radius:10px;overflow:hidden}
.progress div{height:100%;background:#39765a}
hr{border:0;border-top:1px solid #e5edf5;margin:14px 0}
.flash hr{width:80%;border-color:#c3d4e2}
img{max-width:100%;max-height:200px;object-fit:contain}
footer{text-align:center;padding:24px;font-size:14px}
[hidden]{display:none!important}
@media(max-width:480px){
    main{padding:12px}
    section,article{padding:16px}
    .word{font-size:30px}
}
</style>
</head>

<body>

<header>
<div>
    <h1>NIHONGO NÈ</h1>
    <p>語彙学習 — Học từ vựng</p>
    <small>Japanese Learning Studio</small>
</div>
</header>

<main>

<section>
    <a class="btn" href="index.html">← Về trang học tập</a>
    <p id="status" role="status">Đang kiểm tra đăng nhập...</p>
</section>

<div id="app" hidden>

<section>
    <h2>Kho từ vựng JLPT</h2>

    <nav id="levels" aria-label="Trình độ"></nav>

    <div class="grid">

        <label>Bài học
            <select id="lesson"></select>
        </label>

        <label>Chủ đề
            <select id="topic"></select>
        </label>

        <label>Tìm kiếm
            <input id="search" placeholder="Kanji, cách đọc, nghĩa...">
        </label>

        <label>Trạng thái
            <select id="state">
                <option value="">Tất cả</option>
                <option value="known">Đã thuộc</option>
                <option value="review">Cần ôn lại</option>
                <option value="new">Chưa học</option>
            </select>
        </label>

    </div>

    <p id="count"></p>

    <div class="progress">
        <div id="bar"></div>
    </div>

    <nav>
        <button id="listMode">Danh sách</button>
        <button id="flashMode" class="secondary">Flashcard</button>
    </nav>

</section>

<div id="content"></div>

</div>

</main>

<footer>
Tiếng Nhật khó – đã có chúng tớ lo!
</footer>

<script>
'use strict';

const $ = id => document.getElementById(id);

let db,
    all = [],
    filtered = [],
    level = 'N3',
    mode = 'list',
    index = 0,
    page = 0,
    flipped = false,
    marks = {},
    storageKey = '',
    active = false;

let userId = null, saving = false;

const levels = ['N5','N4','N3','N2','N1'];

const status = t => $('status').textContent = t;

function node(tag,text,cls){
    const e = document.createElement(tag);
    if(text != null) e.textContent = text;
    if(cls) e.className = cls;
    return e;
}

function btn(text,fn,cls='secondary'){
    const e = node('button',text,cls);
    e.type = 'button';
    e.onclick = fn;
    return e;
}

function options(id,values){
    const e = $(id);
    const old = e.value;

    e.replaceChildren(new Option('Tất cả',''));

    for(const v of values){
        e.add(new Option(v,v));
    }

    if(values.includes(old)) e.value = old;
}

function choices(){

    const rows = all.filter(r => r.level === level);

    options(
        'lesson',
        [...new Set(
            rows.map(r => r.lesson).filter(Boolean)
        )].sort((a,b) =>
            a.localeCompare(b,undefined,{numeric:true})
        )
    );

    options(
        'topic',
        [...new Set(
            rows.filter(r =>
                !$('lesson').value ||
                r.lesson === $('lesson').value
            ).map(r => r.topic).filter(Boolean)
        )].sort()
    );
}

function norm(v){
    return String(v ?? '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g,'')
        .replace(/đ/g,'d')
        .normalize('NFC');
}

function filter(){

    const q = norm($('search').value.trim());
    const s = $('state').value;

    filtered = all.filter(r =>
        r.level === level &&
        (!$('lesson').value ||
            r.lesson === $('lesson').value) &&
        (!$('topic').value ||
            r.topic === $('topic').value) &&
        (!s || (marks[r.id] || 'new') === s) &&
        [
            r.word,
            r.reading,
            r.han_viet,
            r.meaning,
            r.example,
            r.topic,
            r.lesson
        ].some(v => norm(v).includes(q))
    );

    index = 0;
    page = 0;
    flipped = false;

    render();
}

async function mark(r,value){
    if(!active || saving) return;
    saving = true;
    const uid = userId;
    status('Đang lưu tiến độ...');
    try {
        const {error} = await db.from('vocabulary_progress').upsert({
            user_id: uid, vocabulary_id: r.id, status: value,
            updated_at: new Date().toISOString()
        }, {onConflict:'user_id,vocabulary_id'});
        if(error) throw error;
        if(!active || userId !== uid) return;
        marks[r.id] = value;
        if($('state').value) filter();
        else {
            if(mode === 'flash' && filtered[index]?.id === r.id){
                index = (index + 1) % filtered.length;
                flipped = false;
            }
            render();
        }
        status('Đã lưu tiến độ lên Supabase.');
    } catch(e) {
        if(active && userId === uid) status('Lỗi lưu tiến độ: ' + e.message + '. Hãy thử lại.');
    } finally { saving = false; }
}

async function loadProgress(uid){
    const result = {};
    for(let start=0;;){
        const {data,error} = await db.from('vocabulary_progress')
            .select('vocabulary_id,status').eq('user_id',uid)
            .order('vocabulary_id').range(start,start+499);
        if(error) throw error;
        if(!data.length) break;
        for(const r of data) result[r.vocabulary_id] = r.status;
        start += data.length;
    }
    return result;
}

async function migrateProgress(uid, old){
    const valid = new Set(all.map(r=>r.id));
    const rows = Object.entries(old).filter(([id,v])=>valid.has(id) && ['known','review','new'].includes(v))
        .map(([id,v])=>({user_id:uid,vocabulary_id:id,status:v}));
    for(let i=0;i<rows.length;i+=200){
        if(!active || userId!==uid) return;
        const {error} = await db.from('vocabulary_progress').upsert(rows.slice(i,i+200),{
            onConflict:'user_id,vocabulary_id',ignoreDuplicates:true
        });
        if(error) throw error;
    }
}

function safeUrl(v){
    try{
        const u = new URL(v);
        return u.protocol === 'https:' ? u.href : null;
    }catch{
        return null;
    }
}

function speak(r){

    const url = safeUrl(r.audio_url);

    if(url){
        new Audio(url).play().catch(() => tts(r));
        return;
    }

    tts(r);
}

function tts(r){

    if(!('speechSynthesis' in window)){
        status('Trình duyệt không hỗ trợ phát âm.');
        return;
    }

    const u = new SpeechSynthesisUtterance(
        r.reading || r.word
    );

    u.lang = 'ja-JP';
    u.rate = .85;

    const voice = speechSynthesis
        .getVoices()
        .find(v => v.lang.startsWith('ja'));

    if(voice) u.voice = voice;

    speechSynthesis.cancel();
    speechSynthesis.speak(u);
}

function details(el,r){

    el.append(
        node('p',r.han_viet || '','muted'),
        node('h2',r.meaning),
        node('p',r.word_type || '','muted')
    );

    if(r.example){

        el.append(
            node('hr'),
            node('p',r.example),
            node('p',r.example_translation || '','muted')
        );
    }

    const url = safeUrl(r.image_url);

    if(url){

        const img = node('img');

        img.src = url;
        img.alt = r.word;
        img.loading = 'lazy';

        el.append(img);
    }
}

function actions(r){

    const e = node('div',null,'actions');

    e.append(
        btn('🔊 Phát âm',() => speak(r)),
        btn('Cần ôn lại',() => mark(r,'review')),
        btn('✓ Đã thuộc',() => mark(r,'known'),'')
    );

    return e;
}

function render(){

    if(!active) return;

    const known = filtered.filter(
        r => marks[r.id] === 'known'
    ).length;

    $('count').textContent =
        `${filtered.length} từ · Đã thuộc ${known}/${filtered.length}`;

    $('bar').style.width =
        (filtered.length
            ? known / filtered.length * 100
            : 0) + '%';

    $('listMode').className =
        mode === 'list' ? '' : 'secondary';

    $('flashMode').className =
        mode === 'flash' ? '' : 'secondary';

    const root = $('content');

    root.replaceChildren();

    if(!filtered.length){

        root.append(
            node('section','Chưa có từ vựng phù hợp.')
        );

        return;
    }

    if(mode === 'list'){

        for(const r of filtered.slice(
            page * 30,
            page * 30 + 30
        )){

            const e = node('article');

            e.append(
                node(
                    'span',
                    [r.level,r.lesson,r.topic]
                        .filter(Boolean)
                        .join(' · '),
                    'tag'
                ),

                node('div',r.word,'word'),

                node('p',r.reading),

                node(
                    'p',
                    marks[r.id] === 'known'
                        ? '✓ Đã thuộc'
                        : marks[r.id] === 'review'
                            ? 'Cần ôn lại'
                            : 'Chưa học',
                    'muted'
                )
            );

            details(e,r);

            e.append(actions(r));

            root.append(e);
        }

        const nav = node('nav');

        const prev = btn('← Trang trước',() => {
            page--;
            render();
            $('content').scrollIntoView();
        });

        prev.disabled = page === 0;

        const next = btn('Trang sau →',() => {
            page++;
            render();
            $('content').scrollIntoView();
        });

        next.disabled =
            (page + 1) * 30 >= filtered.length;

        nav.append(
            prev,
            node(
                'span',
                `Trang ${page+1}/${Math.ceil(filtered.length/30)}`
            ),
            next
        );

        root.append(nav);

    }else{

        const r = filtered[index];
        const e = node('section');

        e.append(
            node(
                'p',
                `Flashcard ${index+1}/${filtered.length}`,
                'muted'
            )
        );

        const card = node(
            'div',
            null,
            flipped ? 'flash back' : 'flash'
        );

        card.tabIndex = 0;

        card.setAttribute('role','button');

        card.setAttribute(
            'aria-label',
            flipped
                ? 'Mặt sau. Nhấn để lật thẻ'
                : 'Mặt trước. Nhấn để xem đáp án'
        );

        const flip = () => {

            flipped = !flipped;

            render();

            $('content')
                .querySelector('.flash')
                ?.focus();
        };

        card.onclick = flip;

        card.onkeydown = ev => {

            if(ev.key === 'Enter' || ev.key === ' '){

                ev.preventDefault();

                flip();
            }
        };

        // MAT TRUOC: CHI HIEN THI TU VUNG
        // MAT SAU: HIEN THI CACH DOC VA NGHIA

        if(flipped){

            card.append(
                node('div',r.word,'word'),
                node('p',r.reading,'flash-reading')
            );

            details(card,r);

            card.append(
                node(
                    'p',
                    'Nhấn để quay lại mặt trước',
                    'muted'
                )
            );

        }else{

            card.append(
                node('div',r.word,'word'),
                node(
                    'p',
                    'Nhấn để xem cách đọc và nghĩa',
                    'muted'
                )
            );
        }

        e.append(card);

        const nav = node('nav');

        nav.append(

            btn('← Trước',() => {

                index =
                    (index + filtered.length - 1)
                    % filtered.length;

                flipped = false;

                render();
            }),

            btn('Lật thẻ',flip),

            btn('Tiếp →',() => {

                index =
                    (index + 1) % filtered.length;

                flipped = false;

                render();
            })
        );

        e.append(nav,actions(r));

        root.append(e);
    }
}

for(const l of levels){

    const b = btn(l,() => {

        level = l;

        $('lesson').value = '';
        $('topic').value = '';

        for(const el of $('levels').children){

            el.className =
                el.textContent === l
                    ? 'active'
                    : 'secondary';
        }

        choices();

        filter();

    },l === level ? 'active' : 'secondary');

    $('levels').append(b);
}

$('lesson').onchange = () => {
    choices();
    filter();
};

$('topic').onchange =
$('state').onchange =
$('search').oninput = filter;

$('listMode').onclick = () => {
    mode = 'list';
    render();
};

$('flashMode').onclick = () => {
    mode = 'flash';
    flipped = false;
    render();
};

async function init(){

    try{

        db = window.supabase.createClient(
            'https://hpsjbclptasirfvrxwhn.supabase.co',
            'sb_publishable_bRBYTDMA7u0LrtQZwO8_7A_hSOy2jw5'
        );

        db.auth.onAuthStateChange(event => {

            if(event === 'SIGNED_OUT'){

                active = false;
                userId = null;

                all = [];
                filtered = [];
                marks = {};

                $('content').replaceChildren();

                $('app').hidden = true;

                status('Bạn đã đăng xuất.');
            }
        });

        const {
            data:{user},
            error
        } = await db.auth.getUser();

        if(error || !user){

            status(
                'Bạn chưa đăng nhập. Hãy đăng nhập tại trang học tập.'
            );

            return;
        }

        active = true;
        userId = user.id;

        storageKey = 'nihongo-vocab-v1-' + user.id;

        try{

            marks = JSON.parse(
                localStorage.getItem(storageKey) || '{}'
            ) || {};

        }catch{

            marks = {};
        }

        let rows = [];

        for(let start = 0;;){

            const {data,error} = await db
                .from('vocabulary')
                .select(
                    'id,level,lesson,topic,word,reading,han_viet,meaning,word_type,example,example_translation,audio_url,image_url'
                )
                .eq('published',true)
                .order('id')
                .range(start,start+499);

            if(error) throw error;

            if(!data.length) break;

            rows.push(...data);

            start += data.length;
        }

        if(!active) return;

        all = rows.sort((a,b) =>
            (a.lesson || '').localeCompare(
                b.lesson || '',
                undefined,
                {numeric:true}
            ) ||
            a.word.localeCompare(b.word,'ja')
        );

        const old = marks;
        await migrateProgress(user.id, old);
        if(!active || userId !== user.id) return;
        const remote = await loadProgress(user.id);
        if(!active || userId !== user.id) return;
        marks = remote;
        // Retire legacy cache only after successful migration and read.
        try { localStorage.removeItem(storageKey); } catch(e) {}
        choices();

        $('app').hidden = false;

        filter();

        status('Đã kết nối kho từ vựng và đồng bộ tiến độ.');

    }catch(e){
        active = false;
        $('app').hidden = true;
        status('Lỗi tải từ vựng hoặc tiến độ: ' + e.message);
    }
}

init();

</script>
</body>
</html>
